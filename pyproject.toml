[project]
name = "personal-news-agent"
version = "0.1.0"
description = "Focused personal news assistant MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "claude-agent-sdk>=0.2.123,<0.3",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "uvicorn>=0.30.0",
  "PyMySQL>=1.1.0",
  "alibabacloud_cloudauth20190307==3.13.1",
  "alibabacloud_dypnsapi20170525==2.0.0",
  "alibabacloud_green20220302==2.2.15",
  "alibabacloud-tea-openapi==0.4.4",
  "reportlab>=5.0.0",

]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
